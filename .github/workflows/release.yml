name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: cl /nologo /O2 /MT /EHsc /DUNICODE /D_UNICODE multiout.cpp /Fe:multiout.exe /link /SUBSYSTEM:WINDOWS user32.lib ole32.lib comctl32.lib winmm.lib
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $GITHUB_REF_NAME multiout.exe --generate-notes
      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: multiout
          path: multiout.exe
